# ============================
# MPPI Configuration File
# ============================

# MPPI Parameters
dt: 0.01
n_samples: 30
lambda: 0.1
horizon: 40
n_workers: 15
rollout_chunk_size: 1
seed: 42

# Use the phase-aligned leg gait and current arm IK posture as the MPPI action
# prior. The optimizer searches only for whole-body stabilizing corrections.
gait_startup_blend_steps: 50

# Original EE-tracking controller keeps the body at the stand keyframe and
# does not use locomani's reachability-aware base-height state machine.
keyframe: "stand"
body_reference_keyframe: "stand"
default_gait: "in_place"

# Arm IK parameters used to generate the nominal arm-joint reference.
arm_ik_damping: 0.05
arm_ik_step_size: 0.7
arm_ik_max_iterations: 5
arm_ik_tolerance: 0.0001
arm_ik_smoothing: 0.3
arm_ik_max_step: 0.04

# Initial joint angle
sampling_init:
  - 0.0
  - 0.9
  - -1.8
  - 0.0
  - 0.9
  - -1.8
  - 0.0
  - 0.9
  - -1.8
  - 0.0
  - 0.9
  - -1.8
  - 0.0   # SO-ARM Rotation
  - -1.57 # SO-ARM Pitch
  - 1.57  # SO-ARM Elbow
  - 1.57  # SO-ARM Wrist_Pitch

# ============================
# Contact Dynamics
# ============================
o_solref:
  - 0.02
  - 1.0
rollout_cone: "pyramidal"

# ============================
# Spline Parameters
# ============================
sample_type: "cubic"
n_knots: 4

# ============================
# Noise Parameters
# ============================
noise_sigma:
  - 0.03 # FR hip
  - 0.1  # FR thigh
  - 0.1  # FR calf
  - 0.03 # FL hip
  - 0.1  # FL thigh
  - 0.1  # FL calf
  - 0.03 # RR hip
  - 0.1  # RR thigh
  - 0.1  # RR calf
  - 0.03 # RL hip
  - 0.1  # RL thigh
  - 0.1  # RL calf
  - 0.06 # SO-ARM Rotation
  - 0.06 # SO-ARM Pitch
  - 0.06 # SO-ARM Elbow
  - 0.06 # SO-ARM Wrist_Pitch

gait_noise_scale:
  stance_hold: 0.6
  in_place: 1.0
  walk: 1.0
  walk_fast: 1.0
  trot: 1.2

# Reduce exploration continuously as the measured EE approaches its target.
# The configured gait scale is applied first, followed by these per-group
# scales. Full exploration is restored immediately at or beyond far_error.
dynamic_noise:
  enabled: true
  near_error: 0.03
  far_error: 0.15
  near_leg_scale: 0.20
  near_arm_scale: 0.25

# ============================
# Cost Function Parameters
# ============================
Q_diag:
  - 0.0    # base x
  - 0.0    # base y
  - 1000.0    # base z
  - 5000.0 # roll
  - 3000.0 # pitch
  - 0.0    # yaw
  - 500.0  # FR hip position
  - 500.0  # FR thigh position
  - 500.0  # FR calf position
  - 500.0  # FL hip position
  - 500.0  # FL thigh position
  - 500.0  # FL calf position
  - 500.0  # RR hip position
  - 500.0  # RR thigh position
  - 500.0  # RR calf position
  - 500.0  # RL hip position
  - 500.0  # RL thigh position
  - 500.0  # RL calf position
  - 500.0  # SO-ARM Rotation position
  - 500.0  # SO-ARM Pitch position
  - 500.0  # SO-ARM Elbow position
  - 500.0  # SO-ARM Wrist_Pitch position
  - 0.1    # base linear velocity x
  - 0.1    # base linear velocity y
  - 0.1    # base linear velocity z
  - 0.1    # base angular velocity x
  - 0.1    # base angular velocity y
  - 0.1    # base angular velocity z
  - 0.0    # FR hip velocity
  - 0.0    # FR thigh velocity
  - 0.0    # FR calf velocity
  - 0.0    # FL hip velocity
  - 0.0    # FL thigh velocity
  - 0.0    # FL calf velocity
  - 0.0    # RR hip velocity
  - 0.0    # RR thigh velocity
  - 0.0    # RR calf velocity
  - 0.0    # RL hip velocity
  - 0.0    # RL thigh velocity
  - 0.0    # RL calf velocity
  - 0.0    # SO-ARM Rotation velocity
  - 0.0    # SO-ARM Pitch velocity
  - 0.0    # SO-ARM Elbow velocity
  - 0.0    # SO-ARM Wrist_Pitch velocity

# ============================
# Control Cost Matrix R
# ============================
R_diag:
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001

# ============================
# Arm-to-torso Hard Collision Constraint
# ============================
collision_enabled: true
collision_body_geom: "base_collision"
disable_arm_torso_rollout_contact: true
rollout_arm_root_body: "arm_mount"
collision_capsule_radii: [0.035, 0.035, 0.030, 0.025]
collision_shoulder_exclusion: 1.0
collision_hard_distance: 0.015


# ============================
# EE pos Cost Parameters
# ============================
ee_position_weight: 5000.0
ee_orientation_weight: 0.0 # no orientation tracking


# ============================
# EE Terminal Cost Parameters
# ============================
ee_terminal_scale: 10.0
