# ============================
# MPPI Configuration File
# ============================

# MPPI Parameters
# These control the behavior of the Model Predictive Path Integral optimization.
dt: 0.01          # Time step size for simulation (in seconds).
n_samples: 30     # Number of trajectory samples per iteration.
lambda: 0.1       # Temperature parameter for trajectory cost weighting.
horizon: 40       # Prediction horizon (number of time steps).
n_workers: 5      # Number of parallel workers for optimization.
seed: 42          # Random seed for reproducibility.

# Match the original Go1 planner/simulator startup: initialize around the
# seated control while tracking the standing body pose and in-place gait.
keyframe: "sit"
body_reference_keyframe: "stand"

# Initialize the nominal control at the actual B2-Z1 sit keyframe.  This keeps
# the first MPPI rollout consistent with the simulator state.
sampling_init:
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.0
  - -0.6
  - 0.0

# ============================
# Model Parameters for Contact Dynamics
# ============================
o_solref:
  - 0.02           # Time constant for contact model (stiffness control).
  - 1.0            # Damping ratio for the contact model.
rollout_cone: "pyramidal"

# ============================
# Spline Parameters
# ============================
sample_type: "cubic" # Spline interpolation type ("cubic" for cubic splines).
n_knots: 4          # Number of control points (knots) in the spline.

# ============================
# Noise Parameters
# ============================
# Noise standard deviations applied to control inputs for exploration.
noise_sigma:
  - 0.06 # Hip joint (FR)
  - 0.1  # Thigh joint (FR)
  - 0.1  # Calf joint (FR)
  - 0.06 # Hip joint (FL)
  - 0.1  # Thigh joint (FL)
  - 0.1  # Calf joint (FL)
  - 0.06 # Hip joint (RR)
  - 0.1  # Thigh joint (RR)
  - 0.1  # Calf joint (RR)
  - 0.06 # Hip joint (RL)
  - 0.1  # Thigh joint (RL)
  - 0.1  # Calf joint (RL)
  - 0.0  # Z1 joint1
  - 0.0  # Z1 joint2
  - 0.0  # Z1 joint3
  - 0.0  # Z1 joint4

gait_noise_scale:
  in_place: 1.0
  walk: 1.0
  walk_fast: 1.0
  trot: 1.2

# ============================
# Cost Function Parameters
# ============================
# Diagonal entries of the state cost matrix Q
# Higher values penalize deviations from reference states more heavily.
Q_diag:
  - 3000.0    # Base x position
  - 3000.0    # Base y position
  - 2000.0    # Base z position
  - 300000.0 # Base quaternion distance
  - 0     # Quaternion component
  - 0     # Quaternion component
  - 0     # Quaternion component
  - 1200.0   # FR hip position
  - 1200.0   # FR thigh position
  - 1200.0   # FR calf position
  - 1200.0   # FL hip position
  - 1200.0   # FL thigh position
  - 1200.0   # FL calf position
  - 1200.0   # RR hip position
  - 1200.0   # RR thigh position
  - 1200.0   # RR calf position
  - 1200.0   # RL hip position
  - 1200.0   # RL thigh position
  - 1200.0   # RL calf position
  - 1200.0   # Z1 joint1 position
  - 1200.0   # Z1 joint2 position
  - 1200.0   # Z1 joint3 position
  - 1200.0   # Z1 joint4 position
  - 1        # Base linear velocity x
  - 0.0001  # Base linear velocity y
  - 0.0001  # Base linear velocity z
  - 0.0001  # Base angular velocity x
  - 0.0001  # Base angular velocity y
  - 0.0001  # Base angular velocity z
  - 0.5     # FR hip velocity
  - 0.5     # FR thigh velocity
  - 0.5     # FR calf velocity
  - 0.5     # FL hip velocity
  - 0.5     # FL thigh velocity
  - 0.5     # FL calf velocity
  - 0.5     # RR hip velocity
  - 0.5     # RR thigh velocity
  - 0.5     # RR calf velocity
  - 0.5     # RL hip velocity
  - 0.5     # RL thigh velocity
  - 0.5     # RL calf velocity
  - 0.5     # Z1 joint1 velocity
  - 0.5     # Z1 joint2 velocity
  - 0.5     # Z1 joint3 velocity
  - 0.5     # Z1 joint4 velocity

# ============================
# Control Cost Matrix R
# ============================
# Penalizes excessive control effort (torque commands).
R_diag:
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001