# ============================
# MPPI Configuration File
# ============================

# MPPI Parameters
dt: 0.01
n_samples: 30
lambda: 0.1
horizon: 40
n_workers: 8
seed: 42

# Match the original Go1 planner/simulator startup: initialize around the
# seated control while tracking the standing body pose and in-place gait.
keyframe: "sit"
body_reference_keyframe: "stand"

# Initialize the nominal control at the actual B2-Z1 sit keyframe.  This keeps
# the first MPPI rollout consistent with the simulator state.
sampling_init:
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.28
  - -2.8
  - 0.0
  - 1.0
  - -0.6
  - 0.0

# ============================
# Model Parameters for Contact Dynamics
# ============================
o_solref:
  - 0.02
  - 1.0
rollout_cone: "pyramidal"

# ============================
# Spline Parameters
# ============================
sample_type: "cubic"
n_knots: 4

# ============================
# Noise Parameters
# ============================
noise_sigma:
  - 0.06 # Hip joint (FR)
  - 0.1  # Thigh joint (FR)
  - 0.1  # Calf joint (FR)
  - 0.06 # Hip joint (FL)
  - 0.1  # Thigh joint (FL)
  - 0.1  # Calf joint (FL)
  - 0.06 # Hip joint (RR)
  - 0.1  # Thigh joint (RR)
  - 0.1  # Calf joint (RR)
  - 0.06 # Hip joint (RL)
  - 0.1  # Thigh joint (RL)
  - 0.1  # Calf joint (RL)
  - 0.0  # Z1 joint1
  - 0.0  # Z1 joint2
  - 0.0  # Z1 joint3
  - 0.0  # Z1 joint4

gait_noise_scale:
  in_place: 1.0
  walk: 1.0
  walk_fast: 1.0
  trot: 2.0

# ============================
# Cost Function Parameters
# ============================
Q_diag:
  - 5000.0    # Base x position
  - 5000.0    # Base y position
  - 5000.0    # Base z position
  - 400000.0 # Base quaternion distance
  - 1000.0     # Quaternion component
  - 1000.0     # Quaternion component
  - 1000.0     # Quaternion component
  - 1000.0   # FR hip position
  - 1000.0   # FR thigh position
  - 1000.0   # FR calf position
  - 1000.0   # FL hip position
  - 1000.0   # FL thigh position
  - 1000.0   # FL calf position
  - 1000.0   # RR hip position
  - 1000.0   # RR thigh position
  - 1000.0   # RR calf position
  - 1000.0   # RL hip position
  - 1000.0   # RL thigh position
  - 1000.0   # RL calf position
  - 1000.0   # Z1 joint1 position
  - 1000.0   # Z1 joint2 position
  - 1000.0   # Z1 joint3 position
  - 1000.0   # Z1 joint4 position
  - 1.0     # Base linear velocity x
  - 1.0     # Base linear velocity y
  - 0.0001  # Base linear velocity z
  - 0.0001  # Base angular velocity x
  - 0.0001  # Base angular velocity y
  - 0.0001  # Base angular velocity z
  - 10.0     # FR hip velocity
  - 1.0     # FR thigh velocity
  - 1.0     # FR calf velocity
  - 1.0     # FL hip velocity
  - 1.0     # FL thigh velocity
  - 1.0     # FL calf velocity
  - 1.0     # RR hip velocity
  - 1.0     # RR thigh velocity
  - 1.0     # RR calf velocity
  - 1.0     # RL hip velocity
  - 1.0     # RL thigh velocity
  - 1.0     # RL calf velocity
  - 1.0     # Z1 joint1 velocity
  - 1.0     # Z1 joint2 velocity
  - 1.0     # Z1 joint3 velocity
  - 1.0     # Z1 joint4 velocity

# ============================
# Control Cost Matrix R
# ============================
R_diag:
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001

virtual_pd_gains:
  kp: 50.0
  kd: 3.0
